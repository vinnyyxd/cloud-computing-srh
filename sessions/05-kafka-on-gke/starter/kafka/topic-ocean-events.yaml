# The topic for ocean shipment events.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: ocean-events
  namespace: kafka
  labels:
    strimzi.io/cluster: freight
spec:
  # Partitions are the unit of parallelism and of ordering. You can add more
  # later, never remove them, and adding them moves keys to new partitions.
  partitions: 3
  replicas: 3
  config:
    # Keep events for 30 days, so a later session can rebuild a table from the log.
    retention.ms: 2592000000
    min.insync.replicas: 2
