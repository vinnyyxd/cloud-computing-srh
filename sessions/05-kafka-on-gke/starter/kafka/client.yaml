# A pod with Kafka's command-line tools, for you to exec into.
# Same image and Kafka version as the brokers.
apiVersion: v1
kind: Pod
metadata:
  name: kafka-client
  namespace: kafka
spec:
  containers:
    - name: kafka
      image: quay.io/strimzi/kafka:1.3.0-kafka-4.3.1
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
