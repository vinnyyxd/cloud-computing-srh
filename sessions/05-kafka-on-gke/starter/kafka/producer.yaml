# The generator, now writing ocean events to Kafka instead of to its log.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocean-producer
  namespace: kafka
  labels:
    app: ocean-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocean-producer
  template:
    metadata:
      labels:
        app: ocean-producer
    spec:
      containers:
        - name: generator
          # v2 has the Kafka client that works with Kafka 4 (step 1).
          image: europe-west3-docker.pkg.dev/PROJECT_ID/freight/generator:v2
          args: ["stream"]
          env:
            - name: SINK
              value: kafka
            - name: MODE
              value: ocean
            - name: RATE
              value: "2"
            - name: KAFKA_BOOTSTRAP
              value: freight-kafka-bootstrap:9092
            - name: KAFKA_TOPIC
              value: ocean-events
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
